<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Truck Town">
<meta name="theme-color" content="#69c4ff">
<title>Truck Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a toy construction site. Sky on top, dirt yard below, hazard tape between. Letters are toy blocks. */
:root{
  color-scheme: light;
  --sky:#69c4ff;
  --sky-lo:#bfe8ff;
  --dirt:#cf9356;
  --ink:#2b2d42;
  --safety:#ff8a1f;
  --sun:#ffd23f;
  --paper:#fff6e0;
  --display:'Fredoka','Arial Rounded MT Bold','Nunito',ui-rounded,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--display);font-weight:700;touch-action:manipulation;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
button:focus-visible{outline:.7vmin solid var(--ink);outline-offset:.5vmin}
#app{position:absolute;inset:0;overflow:hidden}

/* ---------- world ---------- */
.world{position:absolute;inset:0;background:linear-gradient(var(--sky),var(--sky-lo) 54%)}
.sun{position:absolute;right:7vmin;top:5vmin;width:15vmin;height:15vmin;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2vmin rgba(255,210,63,.35),0 0 0 4.5vmin rgba(255,210,63,.18)}
.cloud{position:absolute;left:-26vmin;height:7vmin;width:20vmin;background:#fff;border-radius:7vmin;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:9vmin;height:9vmin;left:3vmin;top:-4.5vmin}
.cloud::after{width:7vmin;height:7vmin;left:10vmin;top:-3vmin}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(160vw)}}
.hill{position:absolute;bottom:46%;border-radius:50% 50% 0 0 / 100% 100% 0 0;background:#7bcf6a}
.hill.a{left:-10vmin;width:80vmin;height:20vmin}
.hill.b{right:-14vmin;width:100vmin;height:26vmin;background:#64c059}
.ground{position:absolute;left:0;right:0;bottom:0;height:46%;background:
  radial-gradient(ellipse at 18% 40%,rgba(0,0,0,.09) 0 4vmin,transparent 4.2vmin),
  radial-gradient(ellipse at 72% 64%,rgba(0,0,0,.09) 0 5vmin,transparent 5.2vmin),
  radial-gradient(circle at 44% 82%,#b27339 0 1.4vmin,transparent 1.5vmin),
  radial-gradient(circle at 86% 30%,#b27339 0 1.1vmin,transparent 1.2vmin),
  radial-gradient(circle at 8% 88%,#b27339 0 1.2vmin,transparent 1.3vmin),
  radial-gradient(circle at 60% 48%,#b27339 0 .9vmin,transparent 1vmin),
  var(--dirt)}
.ground::before{content:"";position:absolute;left:0;right:0;top:0;height:2.6vmin;background:repeating-linear-gradient(-45deg,#ffcf1f 0 2.6vmin,var(--ink) 2.6vmin 5.2vmin)}

.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}

/* ---------- shared bits ---------- */
.blk{display:inline-grid;place-items:center;width:var(--b,9vmin);height:var(--b,9vmin);border-radius:1.6vmin;background:var(--c,#fff);color:#fff;font-size:calc(var(--b,9vmin)*.68);line-height:1;border:.7vmin solid var(--ink);box-shadow:0 .8vmin 0 rgba(0,0,0,.25);text-shadow:0 .4vmin 0 rgba(0,0,0,.28)}
.bigword{position:absolute;left:0;right:0;top:3vmin;text-align:center;font-size:20vmin;line-height:1;letter-spacing:.02em;color:#fff;text-shadow:0 1vmin 0 var(--ink),1vmin 0 0 var(--ink),-1vmin 0 0 var(--ink),0 -1vmin 0 var(--ink),.7vmin .7vmin 0 var(--ink),-.7vmin .7vmin 0 var(--ink),.7vmin -.7vmin 0 var(--ink),-.7vmin -.7vmin 0 var(--ink),0 2.2vmin 0 var(--ink);pointer-events:none}
.veh svg,.pick svg,.stage svg{display:block;width:100%;height:auto;filter:drop-shadow(0 1.2vmin 0 rgba(0,0,0,.2))}
.holdbtn{position:absolute;z-index:20;width:max(64px,12vmin);height:max(64px,12vmin);border-radius:50%;background:#fff;box-shadow:0 .8vmin 0 rgba(0,0,0,.25);display:grid;place-items:center}
.holdbtn svg{width:100%;height:100%;overflow:visible}
.holdbtn .track{fill:none;stroke:var(--ink);stroke-width:2.6}
.holdbtn .ring{fill:none;stroke:var(--safety);stroke-width:4;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;transform:rotate(-90deg);transform-origin:22px 22px}
.holdbtn.holding .ring{animation:ring .7s linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}
#homeBtn{top:2.4vmin;left:2.4vmin}
#muteBtn{top:2.4vmin;right:2.4vmin}
#tip{position:absolute;z-index:40;top:15vmin;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:1.4vmin 3.4vmin;border-radius:99px;font-size:3.4vmin;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#tip.show{opacity:1}
#fx{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden}
#fx i{position:absolute;top:-5vmin;width:2.2vmin;height:3.6vmin;border-radius:.5vmin;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(var(--r))}}
.round{position:absolute;display:grid;place-items:center;border-radius:50%;background:#fff;border:.8vmin solid var(--ink);box-shadow:0 1vmin 0 rgba(0,0,0,.28);transition:transform .08s}
.round:active{transform:translateY(.6vmin) scale(.96)}
.round svg{width:56%;height:56%}
.hidden{visibility:hidden;opacity:0}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4vmin)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-4vmin) scale(1.06,.96)}70%{transform:translateY(0) scale(.97,1.03)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---------- start ---------- */
#s-start .title{position:absolute;left:0;right:0;top:7vmin;display:flex;flex-direction:column;align-items:center;gap:2.4vmin}
#s-start .row{display:flex;gap:1.6vmin}
#s-start .blk{--b:13vmin;animation:bob 1.8s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
#startBtn{position:absolute;left:50%;top:63%;margin:-15vmin 0 0 -15vmin;width:30vmin;height:30vmin;border-radius:50%;background:var(--sun);border:1vmin solid var(--ink);box-shadow:0 1.8vmin 0 rgba(0,0,0,.3);display:grid;place-items:center;animation:pulse 1.4s ease-in-out infinite}
#startBtn svg{width:52%;height:52%;margin-left:6%}
#drive{position:absolute;bottom:6%;left:0;width:30vmin;animation:drive 9s linear infinite}
@keyframes drive{from{transform:translateX(-35vmin)}to{transform:translateX(calc(100vw + 5vmin))}}

/* ---------- home ---------- */
#s-home .hdr{position:absolute;top:2.4vmin;left:0;right:0;display:flex;justify-content:center;gap:1vmin;pointer-events:none}
#s-home .hdr .blk{--b:7vmin}
#s-home .hdr .gap{width:2vmin}
.tiles{position:absolute;left:5vmin;right:5vmin;top:14vmin;bottom:3.4vmin;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2vmin}
@media (max-aspect-ratio:1/1){.tiles{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr);gap:2vmin}.tile:last-child{grid-column:1/-1}}
.tile{position:relative;border-radius:4vmin;background:var(--t);border:.9vmin solid var(--ink);box-shadow:0 1.6vmin 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:.6vmin;padding:1.6vmin 1.6vmin 1.4vmin;overflow:hidden;transition:transform .08s}
.tile:active{transform:translateY(1vmin);box-shadow:0 .6vmin 0 rgba(0,0,0,.3)}
.tile .glyph{display:flex;gap:1.2vmin;align-items:center}
.tile .glyph .blk{--b:5.2vmin;--c:#fff;color:var(--t)}
.tile .glyph .emo{font-size:5.2vmin;line-height:1}
.tile .tv{width:min(17vmin,56%)}
.tile .tv svg{display:block;width:100%;height:auto}
.tile .lbl{font-size:2.8vmin;line-height:1;color:#fff;text-shadow:0 .3vmin 0 rgba(0,0,0,.3)}

/* ---------- count ---------- */
#bignum{position:absolute;left:0;right:0;top:2vmin;text-align:center;font-size:27vmin;line-height:1.05;color:#fff;text-shadow:0 1.1vmin 0 var(--ink),1.1vmin 0 0 var(--ink),-1.1vmin 0 0 var(--ink),0 -1.1vmin 0 var(--ink),.8vmin .8vmin 0 var(--ink),-.8vmin .8vmin 0 var(--ink),.8vmin -.8vmin 0 var(--ink),-.8vmin -.8vmin 0 var(--ink),0 2.4vmin 0 var(--ink);pointer-events:none;min-height:28vmin}
#bignum.bump{animation:pop .35s}
#yard{position:absolute;left:3vmin;right:3vmin;top:45%;bottom:16vmin;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:5vmin 2.4vmin}
.veh{position:relative;width:var(--vs,22vmin);animation:bob 1.7s ease-in-out infinite;animation-delay:calc(var(--i)*.14s)}
.veh .badge{display:none;position:absolute;left:50%;top:-8%;margin-left:calc(var(--vs,22vmin)*-.21);width:calc(var(--vs,22vmin)*.42);height:calc(var(--vs,22vmin)*.42);border-radius:50%;background:#fff;border:.7vmin solid var(--ink);place-items:center;font-size:calc(var(--vs,22vmin)*.3);line-height:1;pointer-events:none}
.veh.counted{animation:none}
.veh.counted .badge{display:grid;animation:pop .35s}
.veh.hop{animation:hop .5s ease-out;animation-delay:calc(var(--i)*.07s)}
.veh.again{animation:wiggle .4s}
#chips{position:absolute;left:0;right:0;bottom:2.2vmin;display:flex;justify-content:center;gap:1.2vmin}
.chip{width:max(38px,7.6vmin);height:max(38px,7.6vmin);border-radius:1.8vmin;background:#fff;border:.6vmin solid var(--ink);font-size:max(20px,4.6vmin);line-height:1;box-shadow:0 .7vmin 0 rgba(0,0,0,.25);display:grid;place-items:center}
.chip.on{background:var(--safety);color:#fff;text-shadow:0 .3vmin 0 rgba(0,0,0,.3)}
#nextBtn{right:3.4vmin;bottom:14vmin;width:16vmin;height:16vmin;background:#34b44a;animation:pulse 1.1s ease-in-out infinite;z-index:10}
#nextBtn svg{width:62%;height:62%}

/* ---------- paint + draw ---------- */
#vpick,#bgpick,#wpick{position:absolute;top:2.4vmin;left:17vmin;right:2.4vmin;height:12.6vmin;display:flex;gap:1.4vmin;align-items:center;justify-content:center}
#wpick{right:17vmin}
.vt{flex:0 1 14vmin;height:100%;min-width:0;border-radius:2.2vmin;background:#fff;border:.7vmin solid var(--ink);box-shadow:0 .8vmin 0 rgba(0,0,0,.25);padding:.8vmin;display:grid;place-items:center;transition:transform .08s}
.vt svg{width:100%;height:100%;display:block}
.vt i{display:block;width:100%;height:100%;border-radius:1.2vmin;background:var(--bg);border:.4vmin solid rgba(43,45,66,.3)}
.vt.on{background:var(--sun);transform:translateY(-.6vmin)}
.vt:active{transform:translateY(.5vmin)}
.paper{position:absolute;left:3vmin;right:36vmin;top:17vmin;bottom:3vmin;isolation:isolate;background:#fff;border:1vmin solid var(--ink);border-radius:3vmin;box-shadow:0 1.4vmin 0 rgba(0,0,0,.28);overflow:hidden}
.pcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#lines{position:absolute;inset:0;padding:3%;mix-blend-mode:multiply;pointer-events:none}
#lines svg{width:100%;height:100%;display:block}
.tools{position:absolute;right:3vmin;top:17vmin;width:30vmin;display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vmin}
.sw,.tb{aspect-ratio:1;border-radius:50%;border:.8vmin solid var(--ink);box-shadow:0 .8vmin 0 rgba(0,0,0,.25);display:grid;place-items:center;position:relative;transition:transform .08s}
.sw{background:var(--c)}
.tb{background:#fff}
.sw:active,.tb:active{transform:translateY(.5vmin)}
.sw.on,.tb.on{outline:1vmin solid var(--safety);outline-offset:.4vmin;transform:scale(1.08)}
.tb svg{width:62%;height:62%;display:block}
.tb.size i{display:block;border-radius:50%;background:var(--ink);width:var(--d);height:var(--d)}
.clr svg{width:100%;height:100%}
.clr .ring{fill:none;stroke:var(--safety);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;transform:rotate(-90deg);transform-origin:22px 22px}
.clr.holding .ring{animation:ring .7s linear forwards}
@media (max-aspect-ratio:1/1){
  .paper{right:3vmin;bottom:52vmin}
  .tools{left:3vmin;right:3vmin;top:auto;bottom:3vmin;width:auto;grid-template-columns:repeat(6,1fr)}
  .tb.size{grid-column:span 2;aspect-ratio:2/1;border-radius:4vmin}
}

/* ---------- work site ---------- */
#s-work{--cb:16vmin}
#wsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#wdrive{position:absolute;left:3vmin;bottom:3vmin;display:flex;gap:2.4vmin;z-index:6}
#wact{position:absolute;right:3vmin;bottom:3vmin;display:flex;gap:2.2vmin;z-index:6;align-items:flex-end}
.cb{width:var(--cb);height:var(--cb);border-radius:50%;background:var(--bg,#fff);border:.9vmin solid var(--ink);box-shadow:0 1vmin 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2vmin;touch-action:none;position:relative;transition:transform .06s}
.cb span{font-size:calc(var(--cb)*.4);line-height:1}
.cb small{font-size:calc(var(--cb)*.15);line-height:1;letter-spacing:.04em;color:var(--ink)}
.cb svg{width:60%;height:60%}
.cb:active,.cb.on{transform:translateY(.7vmin);box-shadow:0 .3vmin 0 rgba(0,0,0,.3)}
.cb.on{background:var(--sun)}
#wReset{top:2.4vmin;right:2.4vmin}
#wReset .track{fill:none;stroke:var(--ink);stroke-width:2.6}
@media (max-aspect-ratio:1/1){#s-work{--cb:13.4vmin}#wact{gap:1.6vmin}#wdrive{gap:1.6vmin}}

/* ---------- pop the bubbles ---------- */
#s-pop{background:linear-gradient(#58b9f7,#d6f0ff)}
#bubbles{position:absolute;inset:0;overflow:hidden}
.bw{position:absolute;bottom:-34vmin;width:var(--s);height:var(--s);animation:rise var(--dur) linear forwards}
@keyframes rise{to{transform:translateY(calc(-100vh - 44vmin))}}
.bub{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:.6vmin solid rgba(255,255,255,.8);box-shadow:inset -1.4vmin -1.4vmin 3vmin rgba(255,255,255,.25),0 .6vmin 1.6vmin rgba(0,0,0,.12);animation:sway 3.2s ease-in-out infinite;animation-delay:var(--dl);color:#fff;font-size:calc(var(--s)*.5);line-height:1;text-shadow:0 .5vmin 0 rgba(43,45,66,.55),.4vmin 0 0 rgba(43,45,66,.55),-.4vmin 0 0 rgba(43,45,66,.55);touch-action:manipulation}
@keyframes sway{0%,100%{transform:translateX(-2.6vmin)}50%{transform:translateX(2.6vmin)}}
.bub.pop{animation:burst .22s ease-out forwards}
@keyframes burst{to{transform:scale(1.5);opacity:0}}
#fx b{position:absolute;width:2.4vmin;height:2.4vmin;margin:-1.2vmin 0 0 -1.2vmin;border-radius:50%;animation:spray .55s ease-out forwards}
@keyframes spray{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#popModes{position:absolute;top:2.4vmin;left:0;right:0;display:flex;justify-content:center;gap:2.4vmin;z-index:5;pointer-events:none}
.mb{pointer-events:auto;width:12vmin;height:12vmin;border-radius:50%;background:#fff;border:.8vmin solid var(--ink);box-shadow:0 .9vmin 0 rgba(0,0,0,.25);font-size:6vmin;line-height:1;display:grid;place-items:center;transition:transform .08s}
.mb.on{background:var(--sun);transform:translateY(-.6vmin)}
#popCount{position:absolute;top:1.6vmin;right:3vmin;font-size:13vmin;line-height:1;color:#fff;z-index:4;min-width:14vmin;text-align:right;text-shadow:0 .8vmin 0 var(--ink),.8vmin 0 0 var(--ink),-.8vmin 0 0 var(--ink),0 -.8vmin 0 var(--ink),.6vmin .6vmin 0 var(--ink),-.6vmin .6vmin 0 var(--ink),.6vmin -.6vmin 0 var(--ink),-.6vmin -.6vmin 0 var(--ink);pointer-events:none}
#popCount.bump{animation:pop .3s}

/* ---------- garage hide and seek ---------- */
#seek{position:absolute;left:50%;top:3vmin;transform:translateX(-50%);display:flex;align-items:center;gap:3vmin}
#seekPic{width:34vmin;height:20vmin;background:#fff;border:1vmin solid var(--ink);border-radius:3vmin;box-shadow:0 1.2vmin 0 rgba(0,0,0,.28);display:grid;place-items:center;padding:1.2vmin}
#seekPic svg{width:100%;height:100%;display:block}
#seekHear{position:relative;width:15vmin;height:15vmin;background:var(--sun)}
#bays{position:absolute;left:4vmin;right:4vmin;top:30%;bottom:7vmin;display:flex;gap:3vmin;justify-content:center;align-items:center}
.bay{position:relative;flex:1 1 0;max-width:44vmin;aspect-ratio:1/1.05;border:1vmin solid var(--ink);border-radius:3vmin 3vmin 1vmin 1vmin;overflow:hidden;box-shadow:0 1.4vmin 0 rgba(0,0,0,.3);background:var(--ink);padding:0}
.bay .inside{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 75%,#4a5070,#2b2d42)}
.bay .inside svg{width:84%;height:auto;display:block;margin-top:14%}
.bay .inside .emo{font-size:15vmin;line-height:1;margin-top:10%}
.bay .door{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,var(--c) 0 4.4vmin,var(--c2) 4.4vmin 5.2vmin);transition:transform .7s cubic-bezier(.3,1.35,.5,1);border-bottom:.8vmin solid var(--ink)}
.bay.open .door{transform:translateY(-88%)}
.bay:active:not(.open) .door{transform:translateY(2%)}
.bay.found{animation:hop .6s ease-out 2}
@media (max-aspect-ratio:1/1){.bay{aspect-ratio:1/1.45}#bays{top:28%}}

/* ---------- sticker scene ---------- */
#spick{position:absolute;top:2.4vmin;left:17vmin;right:2.4vmin;height:12.6vmin;display:flex;gap:1.4vmin;align-items:center;justify-content:center}
#scene{position:absolute;inset:0;--sk1:#69c4ff;--sk2:#cdeeff;--gd:#cf9356;--hz:repeating-linear-gradient(-45deg,#ffcf1f 0 2.6vmin,#2b2d42 2.6vmin 5.2vmin);background:linear-gradient(var(--sk1),var(--sk2) 56%,var(--gd) 56%);touch-action:none;overflow:hidden}
#scene::before{content:"";position:absolute;left:0;right:0;top:56%;height:2.4vmin;background:var(--hz);pointer-events:none}
.stk{position:absolute;transform:translate(-50%,-50%);touch-action:none;width:var(--w)}
.stk.em{width:auto;font-size:var(--w);line-height:1}
.stk .si{display:block;animation:stkpop .35s ease-out;transform-origin:50% 100%}
.stk .fl{display:block}
@keyframes stkpop{0%{transform:scale(.2)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.stk svg{width:100%;height:auto;display:block;filter:drop-shadow(0 .8vmin 0 rgba(0,0,0,.2))}
.tb .emo{font-size:5.2vmin;line-height:1}
.tb.on-s{outline:1vmin solid var(--safety);outline-offset:.4vmin;transform:scale(1.08)}
@media (max-aspect-ratio:1/1){.tb .emo{font-size:7vmin}}

/* ---------- find ---------- */
#target{position:absolute;left:50%;top:3vmin;transform:translateX(-50%);display:flex;align-items:center;gap:3vmin}
#targetDot{width:23vmin;height:23vmin;border-radius:50%;border:1vmin solid var(--ink);box-shadow:0 1.2vmin 0 rgba(0,0,0,.28);background:var(--tc,#fff)}
#targetDot.pop{animation:pop .4s}
#hear{position:relative;width:15vmin;height:15vmin;background:var(--sun)}
#findRow{position:absolute;left:3vmin;right:3vmin;top:50%;bottom:6vmin;display:flex;justify-content:center;align-items:center;gap:3vmin}
.pick{position:relative;flex:1 1 0;max-width:56vmin;transition:transform .1s}
.pick:active{transform:scale(.96)}
.pick.wiggle{animation:wiggle .45s}
.pick.hint{animation:pulse .8s ease-in-out infinite}
.pick.win{animation:hop .55s ease-out 2}

/* ---------- abc ---------- */
#abcCard{--bs:min(42vmin,calc((100vw - 40vmin)/2));position:absolute;left:50%;transform:translateX(-50%);top:15%;width:calc(var(--bs)*2 + 4vmin);display:flex;justify-content:center;align-items:center;gap:4vmin}
#abcCard.pop > *{animation:pop .35s}

#letterBlk small{display:block;position:absolute;right:2.4vmin;bottom:1vmin;font-size:calc(var(--bs)*.24);opacity:.9}

#pic{width:var(--bs);height:var(--bs);border-radius:5vmin;background:#fff;border:1vmin solid var(--ink);box-shadow:0 1.8vmin 0 rgba(0,0,0,.3);display:grid;place-items:center;padding:2vmin;transition:transform .08s}
#pic:active{transform:translateY(1vmin)}
#pic .emo{font-size:calc(var(--bs)*.66);line-height:1}
#pic svg{width:100%;height:auto}
#caption{position:absolute;left:0;right:0;top:calc(15% + min(42vmin,calc((100vw - 40vmin)/2)) + 5vmin);text-align:center;font-size:7vmin;line-height:1.1;color:#fff;text-shadow:0 .6vmin 0 var(--ink),.6vmin 0 0 var(--ink),-.6vmin 0 0 var(--ink),0 -.6vmin 0 var(--ink),.5vmin .5vmin 0 var(--ink),-.5vmin .5vmin 0 var(--ink),.5vmin -.5vmin 0 var(--ink),-.5vmin -.5vmin 0 var(--ink);pointer-events:none;padding:0 2vmin}
.arrow{top:calc(15% + min(42vmin,calc((100vw - 40vmin)/2))/2 - 7.5vmin);width:15vmin;height:15vmin;background:var(--sun)}
#prev{left:2vmin}
#next{right:2vmin}
#singBtn{left:2.4vmin;bottom:4vmin;width:max(60px,13vmin);height:max(60px,13vmin);background:#34b44a;z-index:5}

#singBtn .stop{display:none}
#singBtn.on .stop{display:block}
#singBtn.on .play{display:none}
#strip{position:absolute;left:calc(2.4vmin + max(60px,13vmin) + 2vmin);right:2vmin;bottom:3vmin;display:flex;gap:1.2vmin;overflow-x:auto;overflow-y:hidden;padding:1vmin 0 2vmin;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
#strip .chip{flex:0 0 auto;width:max(48px,10.4vmin);height:max(48px,10.4vmin);font-size:max(24px,6.4vmin);background:var(--cc);color:#fff;text-shadow:0 .3vmin 0 rgba(0,0,0,.3)}
#strip .chip.on{outline:.9vmin solid var(--ink);outline-offset:.3vmin;transform:translateY(-.8vmin)}

@media (max-aspect-ratio:1/1){#s-home .hdr .blk{--b:5.4vmin}}
@media (prefers-reduced-motion:reduce){
  .cloud,#drive,.veh,#startBtn,#s-start .blk,#nextBtn{animation:none!important}
}

</head>
<body>
<div id="app">
  <div class="world">
    <div class="sun"></div>
    <div class="cloud" style="top:10vmin;animation-duration:70s"></div>
    <div class="cloud" style="top:24vmin;width:16vmin;animation-duration:95s;animation-delay:-40s"></div>
    <div class="cloud" style="top:36vmin;animation-duration:120s;animation-delay:-80s"></div>
    <div class="hill a"></div><div class="hill b"></div>
    <div class="ground"></div>
  </div>

  <!-- START -->
  <section class="screen on" id="s-start">
    <div class="title" id="title"></div>
    <button id="startBtn" aria-label="Play"><svg viewBox="0 0 40 40"><path d="M9 4 L35 20 L9 36 Z" fill="#fff" stroke="#2b2d42" stroke-width="3.2" stroke-linejoin="round"/></svg></button>
    <div id="drive"></div>
  </section>

  <!-- HOME -->
  <section class="screen" id="s-home">
    <div class="hdr" id="hdr"></div>
        <div class="tiles">
      <button class="tile" data-go="count" style="--t:#ff8a1f" aria-label="Count"><div class="glyph"><span class="blk">1</span><span class="blk">2</span><span class="blk">3</span></div><div class="tv" data-v="dump" data-c="#ffcf1f"></div><span class="lbl">Count</span></button>
      <button class="tile" data-go="abc" style="--t:#ee3a3a" aria-label="ABC"><div class="glyph"><span class="blk">A</span><span class="blk">B</span><span class="blk">C</span></div><div class="tv" data-v="mixer" data-c="#8f4fd6"></div><span class="lbl">ABC</span></button>
      <button class="tile" data-go="find" style="--t:#34b44a" aria-label="Find the color"><div class="glyph"><span class="blk" style="--c:#8f4fd6"></span><span class="blk" style="--c:#ff7eb6"></span><span class="emo">🔍</span></div><div class="tv" data-v="bulldozer" data-c="#2f7cf6"></div><span class="lbl">Find the color</span></button>
      <button class="tile" data-go="paint" style="--t:#2f7cf6" aria-label="Paint colors"><div class="glyph"><span class="blk" style="--c:#ee3a3a"></span><span class="blk" style="--c:#ffcf1f"></span><span class="blk" style="--c:#34b44a"></span></div><div class="tv" data-v="excavator" data-c="#ff8a1f"></div><span class="lbl">Paint</span></button>
      <button class="tile" data-go="draw" style="--t:#8f4fd6" aria-label="Draw"><div class="glyph"><span class="blk" style="--c:#ee3a3a"></span><span class="blk" style="--c:#2f7cf6"></span><span class="emo">✏️</span></div><div class="tv" data-v="roller" data-c="#ffcf1f"></div><span class="lbl">Draw</span></button>
      <button class="tile" data-go="work" style="--t:#14a39a" aria-label="Drive and dig"><div class="glyph"><span class="emo">⛏️</span><span class="emo">🚧</span></div><div class="tv" data-v="crane" data-c="#ee3a3a"></div><span class="lbl">Drive &amp; Dig</span></button>
      <button class="tile" data-go="pop" style="--t:#e04f9b" aria-label="Pop the bubbles"><div class="glyph"><span class="blk" style="--c:#2f7cf6;border-radius:50%"></span><span class="blk" style="--c:#ffcf1f;border-radius:50%"></span><span class="blk" style="--c:#34b44a;border-radius:50%"></span></div><div class="tv" data-v="mixer" data-c="#ffcf1f"></div><span class="lbl">Pop Bubbles</span></button>
      <button class="tile" data-go="hide" style="--t:#5c7cfa" aria-label="Garage hide and seek"><div class="glyph"><span class="emo">🚪</span><span class="emo">❓</span></div><div class="tv" data-v="dump" data-c="#ee3a3a"></div><span class="lbl">Hide &amp; Seek</span></button>
      <button class="tile" data-go="stick" style="--t:#2b8a3e" aria-label="Sticker scene"><div class="glyph"><span class="emo">⭐</span><span class="emo">🌳</span><span class="emo">🏠</span></div><div class="tv" data-v="excavator" data-c="#ffcf1f"></div><span class="lbl">Stickers</span></button>
    </div>
  </section>

  <!-- COUNT -->
  <section class="screen" id="s-count">

    <div id="yard"></div>

    <div id="wpick"></div>
    <button class="holdbtn" id="wReset" aria-label="Hold to flatten the ground"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="19"/><circle class="ring" cx="22" cy="22" r="19"/><path d="M13 15 H31 M18 15 V12 H26 V15 M15.5 15 L17 32 H27 L28.5 15 M20 20 V28 M24 20 V28" fill="none" stroke="#2b2d42" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="wdrive">

      <button class="cb" data-d="1" aria-label="Drive right"><svg viewBox="0 0 40 40"><path d="M8 20 H30 M20 9 L31 20 L20 31" fill="none" stroke="#2b2d42" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>

<!-- POP -->

  <!-- HIDE AND SEEK -->

    <div id="seek"><div id="seekPic"></div><button class="round" id="seekHear" aria-label="Hear it again"><svg viewBox="0 0 40 40"><path d="M6 15 H13 L22 7 V33 L13 25 H6 Z" fill="#2b2d42"/><path d="M27 13 Q32 20 27 27 M31 8 Q39 20 31 32" fill="none" stroke="#2b2d42" stroke-width="3.6" stroke-linecap="round"/></svg></button></div>

<!-- FIND -->

      <div id="targetDot"></div>

    </div>

  <!-- ABC -->

    <div id="caption"></div>

    <button class="round arrow" id="next" aria-label="Next letter"><svg viewBox="0 0 40 40"><path d="M8 20 H30 M20 9 L31 20 L20 31" fill="none" stroke="#2b2d42" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

    <div id="strip"></div>

  <!-- shared -->
  <button class="holdbtn" id="homeBtn" aria-label="Hold to go home" style="display:none"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="19"/><circle class="ring" cx="22" cy="22" r="19"/><path d="M12 23 L22 14 L32 23 M15 21 V31 H29 V21" fill="none" stroke="#2b2d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  <div id="fx"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = n => Math.floor(Math.random() * n);

/* ---------- colors ---------- */
const COLORS = [
  { n: 'red',    h: '#ee3a3a' },
  { n: 'orange', h: '#ff8a1f' },
  { n: 'yellow', h: '#ffcf1f' },
  { n: 'green',  h: '#34b44a' },
  { n: 'blue',   h: '#2f7cf6' },
  { n: 'purple', h: '#8f4fd6' },
  { n: 'pink',   h: '#ff7eb6' },
  { n: 'brown',  h: '#8a5a33' },
  { n: 'black',  h: '#3a3f4d' },
  { n: 'white',  h: '#ffffff' }
];
const BRIGHT = COLORS.slice(0, 7);
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = a < 0 ? 0 : 255, p = Math.abs(a);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* ---------- vehicles (original, drawn in SVG) ---------- */
const S = 'stroke="#2b2d42" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
const GLASS = '#cdeeff', STEEL = '#4a5060', LIGHT = '#d9dde5';
const wheel = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#2b2d42"/><circle cx="${x}" cy="${y}" r="${(r * .45).toFixed(1)}" fill="${LIGHT}" stroke="none"/>`;
const svg = (vb, body) => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g ${S}>${body}</g></svg>`;

const VEH = {
  dump: { name: 'dump truck', svg: c => svg('0 0 230 130', `
    <rect x="8" y="88" width="214" height="16" rx="5" fill="${STEEL}"/>
    <path d="M10 34 H124 L132 90 H10 Z" fill="${c}"/>
    <path d="M10 34 H124 L126 46 H10 Z" fill="${shade(c, -.2)}"/>
    <path d="M132 56 H166 Q176 56 181 66 L186 74 H210 Q218 74 218 82 V90 H132 Z" fill="${c}"/>
    <path d="M140 63 H164 Q169 63 172 68 L178 74 H140 Z" fill="${GLASS}"/>
    <rect x="208" y="79" width="9" height="8" rx="3" fill="#ffd23f" stroke-width="3"/>
    ${wheel(40, 104, 17)}${wheel(84, 104, 17)}${wheel(172, 104, 17)}`) },
  excavator: { name: 'excavator', svg: c => svg('0 0 240 150', `
    <rect x="26" y="108" width="136" height="30" rx="15" fill="${STEEL}"/>
    <circle cx="46" cy="123" r="8" fill="${LIGHT}" stroke-width="3"/><circle cx="94" cy="123" r="8" fill="${LIGHT}" stroke-width="3"/><circle cx="142" cy="123" r="8" fill="${LIGHT}" stroke-width="3"/>
    <path d="M136 80 L190 32" stroke="#2b2d42" stroke-width="18"/><path d="M136 80 L190 32" stroke="${c}" stroke-width="10"/>
    <path d="M190 32 L218 92" stroke="#2b2d42" stroke-width="16"/><path d="M190 32 L218 92" stroke="${shade(c, -.22)}" stroke-width="8"/>
    <rect x="40" y="72" width="110" height="38" rx="8" fill="${c}"/>
    <rect x="32" y="78" width="22" height="30" rx="8" fill="${shade(c, -.28)}"/>
    <path d="M96 36 H136 Q144 36 144 44 V72 H96 Z" fill="${c}"/>
    <rect x="103" y="43" width="34" height="22" rx="4" fill="${GLASS}"/>
    <path d="M206 88 L232 80 L228 106 Q216 114 204 102 Z" fill="#7b8494"/>`) },
  bulldozer: { name: 'bulldozer', svg: c => svg('0 0 240 140', `
    <rect x="34" y="96" width="146" height="34" rx="17" fill="${STEEL}"/>
    <circle cx="54" cy="113" r="8" fill="${LIGHT}" stroke-width="3"/><circle cx="107" cy="113" r="8" fill="${LIGHT}" stroke-width="3"/><circle cx="160" cy="113" r="8" fill="${LIGHT}" stroke-width="3"/>
    <rect x="68" y="30" width="10" height="32" rx="3" fill="${STEEL}"/>
    <rect x="170" y="90" width="36" height="12" rx="4" fill="${STEEL}"/>
    <rect x="56" y="58" width="112" height="42" rx="8" fill="${c}"/>
    <rect x="104" y="22" width="58" height="40" rx="6" fill="${c}"/>
    <rect x="112" y="29" width="42" height="24" rx="4" fill="${GLASS}"/>
    <rect x="98" y="14" width="70" height="10" rx="4" fill="${shade(c, -.3)}"/>
    <rect x="198" y="46" width="16" height="82" rx="7" fill="#9aa3b0"/>`) },
  mixer: { name: 'cement mixer', svg: c => svg('0 0 240 140', `
    <rect x="8" y="92" width="224" height="14" rx="5" fill="${STEEL}"/>
    <g transform="rotate(-16 82 62)"><ellipse cx="82" cy="62" rx="68" ry="36" fill="${c}"/>
      <path d="M32 48 Q82 82 132 48" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="7" stroke-linecap="round"/>
      <path d="M24 66 Q82 100 140 66" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="7" stroke-linecap="round"/></g>
    <path d="M140 58 H176 Q186 58 191 68 L196 76 H222 Q230 76 230 84 V92 H140 Z" fill="${c}"/>
    <path d="M148 65 H174 Q179 65 182 70 L188 76 H148 Z" fill="${GLASS}"/>
    <rect x="221" y="80" width="9" height="8" rx="3" fill="#ffd23f" stroke-width="3"/>
    ${wheel(36, 106, 17)}${wheel(80, 106, 17)}${wheel(184, 106, 17)}`) },
  roller: { name: 'road roller', svg: c => svg('0 0 230 140', `
    <rect x="68" y="82" width="24" height="11" rx="4" fill="${STEEL}"/>
    <rect x="52" y="60" width="130" height="30" rx="8" fill="${c}"/>
    <rect x="112" y="24" width="58" height="40" rx="6" fill="${c}"/>
    <rect x="120" y="31" width="42" height="24" rx="4" fill="${GLASS}"/>
    <rect x="106" y="17" width="70" height="10" rx="4" fill="${shade(c, -.3)}"/>
    <rect x="10" y="68" width="76" height="58" rx="26" fill="#aab2bf"/>
    <circle cx="48" cy="97" r="9" fill="${STEEL}" stroke-width="3"/>
    <circle cx="170" cy="100" r="30" fill="#2b2d42"/><circle cx="170" cy="100" r="13" fill="${LIGHT}" stroke="none"/>`) },
  crane: { name: 'crane', svg: c => svg('0 0 250 150', `
    <rect x="12" y="104" width="226" height="14" rx="5" fill="${STEEL}"/>
    <path d="M122 90 L216 24" stroke="#2b2d42" stroke-width="20"/><path d="M122 90 L216 24" stroke="${c}" stroke-width="12"/>
    <path d="M214 26 V72" stroke-width="3.5" fill="none"/>
    <rect x="205" y="70" width="18" height="13" rx="3" fill="#ffd23f"/>
    <rect x="104" y="84" width="72" height="22" rx="6" fill="${shade(c, -.25)}"/>
    <path d="M16 104 V84 Q16 76 24 76 H48 L56 64 Q60 58 68 58 H96 V104 Z" fill="${c}"/>
    <path d="M64 66 H90 V82 H58 Z" fill="${GLASS}"/>
    <rect x="11" y="84" width="8" height="9" rx="3" fill="#ffd23f" stroke-width="3"/>
    ${wheel(48, 118, 17)}${wheel(136, 118, 17)}${wheel(194, 118, 17)}`) }
};
const VKEYS = Object.keys(VEH);

/* ---------- letters ---------- */
const L = [
  ['the letter A','ambulance','e','🚑'], ['bee','bulldozer','v','bulldozer'], ['see','crane','v','crane'], ['dee','dump truck','v','dump'],
  ['ee','excavator','v','excavator'], ['eff','fire truck','e','🚒'], ['jee','giraffe','e','🦒'], ['aitch','helicopter','e','🚁'],
  ['eye','ice cream','e','🍦'], ['jay','jeep','e','🚙'], ['kay','kite','e','🪁'], ['el','lion','e','🦁'],
  ['em','mixer truck','v','mixer'], ['en','nut','e','🥜'], ['oh','orange','e','🍊'], ['pee','pickup truck','e','🛻'],
  ['cue','queen','e','👑'], ['ar','road roller','v','roller'], ['ess','sun','e','☀️'], ['tee','tractor','e','🚜'],
  ['you','umbrella','e','☂️'], ['vee','van','e','🚐'], ['double you','whale','e','🐳'], ['ex','X marks the spot','e','❌','ex marks the spot'],
  ['why','yo-yo','e','🪀'], ['zee','zebra','e','🦓']
].map((r, i) => ({ ch: String.fromCharCode(65 + i), p: r[0], word: r[1], kind: r[2], val: r[3], say: r[4] }));

/* ---------- sound + voice ---------- */
let muted = false, voice = null, ac = null;
const TTS = 'speechSynthesis' in window;
function pickVoice() {
  if (!TTS) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /samantha|ava|allison|zoe|nicky|susan/i.test(v.name))

    const L = Math.max(.001, v.load); r.mound.setAttribute('transform', `translate(0 ${(-87 * (1 - L)).toFixed(1)}) scale(1 ${L.toFixed(3)})`); r.mound.style.display = v.load < .03 ? 'none' : '';
  }
  if (k === 'excavator') {
    r.b1.setAttribute('transform', `rotate(${v.pose[0].toFixed(1)} 36 -58)`); r.b2.setAttribute('transform', `rotate(${v.pose[1].toFixed(1)} 90 -106)`); r.b3.setAttribute('transform', `rotate(${v.pose[2].toFixed(1)} 118 -46)`);
    r.bload.setAttribute('opacity', v.eload > 30 ? 1 : 0);
  }
  if (k === 'bulldozer') {
    r.blade.setAttribute('transform', `translate(0 ${v.by.toFixed(1)})`);
    const w = 10 + Math.sqrt(v.bl) * 1.9, H = Math.min(64, v.bl / 20);
    r.bmound.setAttribute('d', v.bl > 12 ? `M104 1 Q${(104 + w * .12).toFixed(1)} ${(-H * 1.5).toFixed(1)} ${(104 + w).toFixed(1)} 1 Z` : '');
  }
  if (k === 'mixer') r.stripes.forEach(s => s.setAttribute('stroke-dashoffset', (-v.stripe).toFixed(1)));
  if (k === 'crane') {

  }
  if (k === 'crane') {

}
function wkTick(ts) {
  if (!WK.on) return;
  const dt = Math.min(.05, (ts - WK.last) / 1000 || .016); WK.last = ts;
  wkUpdate(dt); wkRender();
  WK.raf = requestAnimationFrame(wkTick);
}
function stopWork() { WK.on = false; cancelAnimationFrame(WK.raf); WK.eng = -1; if (engNode) wkEngine(0); }
function wkReset() {
  wkInitTerrain(); const k = WK.vk; WK.crates.forEach(c => { c.att = false; });
  const x = WK.v ? WK.v.x : WK.WW * .3; wkBuildVehicle(k); WK.v.x = x; wkBuildActions(k); sfx.swish(); say('All clean!');
}
function wkBuildOnce() {
  WK.built = true;
  $('#wpick').innerHTML = VKEYS.map(k => `<button class="vt" data-k="${k}" aria-label="${VEH[k].name}">${VEH[k].svg(WKCOL[k])}</button>`).join('');
  $('#wpick').addEventListener('pointerdown', e => { const b = e.target.closest('.vt'); if (b && b.dataset.k !== WK.vk) pickWork(b.dataset.k, true); else if (b) sfx.honk(); });
  $('#wact').addEventListener('pointerdown', e => {
    const b = e.target.closest('.cb'); if (!b) return; e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
    wkAct(b.dataset.a, true, b);
  });
  ['pointerup', 'pointercancel'].forEach(ev => $('#wact').addEventListener(ev, e => { const b = e.target.closest('.cb'); if (b && b.dataset.hold) wkAct(b.dataset.a, false, b); }));
  $('#wdrive').addEventListener('pointerdown', e => {
    const b = e.target.closest('.cb'); if (!b) return; e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
    WK.hold = +b.dataset.d; WK.target = null; b.classList.add('on');
  });
  ['pointerup', 'pointercancel'].forEach(ev => $('#wdrive').addEventListener(ev, e => { const b = e.target.closest('.cb'); if (!b) return; if (WK.hold === +b.dataset.d) WK.hold = 0; b.classList.remove('on'); }));
  const svg = $('#wsvg'); let drag = false;
  const toW = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  svg.addEventListener('pointerdown', e => { drag = true; try { svg.setPointerCapture(e.pointerId); } catch (_) {} if (WK.v && !WK.v.busy) WK.target = toW(e).x; });
  svg.addEventListener('pointermove', e => { if (drag && WK.v && !WK.v.busy) WK.target = toW(e).x; });
  ['pointerup', 'pointercancel'].forEach(ev => svg.addEventListener(ev, () => { drag = false; }));
  hold($('#wReset'), wkReset, 'Hold to flatten the ground');
  if ('ResizeObserver' in window) new ResizeObserver(() => { if (WK.on) wkLayout(); }).observe(svg);
}
function enterWork() {
  if (!WK.built) wkBuildOnce();
  wkLayout();
  if (!WK.v) pickWork(WK.vk, false); else document.querySelectorAll('#wpick .vt').forEach(b => b.classList.toggle('on', b.dataset.k === WK.vk));
  WK.on = true; WK.last = performance.now(); cancelAnimationFrame(WK.raf); WK.raf = requestAnimationFrame(wkTick);
}
window.__truck = { WK };

/* ---------- POP THE BUBBLES ---------- */
let popMode = 'color', popTimer = 0, popCount = 0;
const POPM = [['color', '🎨', 'colors'], ['num', '🔢', 'numbers'], ['abc', '🔤', 'letters']];
function stopPop() { clearInterval(popTimer); popTimer = 0; }
function syncPop() { document.querySelectorAll('#popModes .mb').forEach(b => b.classList.toggle('on', b.dataset.m === popMode)); }
function enterPop() {
  const pm = $('#popModes');
  if (!pm.children.length) {
    pm.innerHTML = POPM.map(m => `<button class="mb" data-m="${m[0]}" aria-label="${m[2]}">${m[1]}</button>`).join('');
    pm.addEventListener('pointerdown', e => {
      const b = e.target.closest('.mb'); if (!b) return;
      popMode = b.dataset.m; $('#bubbles').innerHTML = ''; syncPop(); sfx.swish(); say(POPM.find(m => m[0] === popMode)[2]);
      for (let i = 0; i < 7; i++) spawnBubble(true);
    });
    $('#bubbles').addEventListener('pointerdown', e => {
      const b = e.target.closest('.bub'); if (!b || b.classList.contains('pop')) return;
      e.preventDefault(); popBubble(b);
    });
  }
  popCount = 0; $('#popCount').textContent = '0'; $('#bubbles').innerHTML = ''; syncPop();
  stopPop(); popTimer = setInterval(spawnBubble, 850);
  for (let i = 0; i < 7; i++) spawnBubble(true);
}
function spawnBubble(pre) {
  const box = $('#bubbles'); if (!$('#s-pop').classList.contains('on') || box.children.length >= 11) return;
  const c = BRIGHT[rnd(7)], size = 15 + Math.random() * 10, dur = 8 + Math.random() * 5; let label = '', sp = c.n;
  if (popMode === 'num') { const n = 1 + rnd(10); label = n; sp = W[n]; }
  else if (popMode === 'abc') { const i = rnd(26); label = L[i].ch; sp = L[i].p; }
  const w = document.createElement('div'); w.className = 'bw';
  w.style.cssText = `--s:${size.toFixed(1)}vmin;--dur:${dur.toFixed(1)}s;${pre === true ? `animation-delay:-${(Math.random() * dur * .75).toFixed(1)}s;` : ''}left:${(4 + Math.random() * 78).toFixed(1)}%`;
  const b = document.createElement('button'); b.className = 'bub'; b.setAttribute('aria-label', 'bubble');
  b.style.cssText = `--dl:${(-Math.random() * 3).toFixed(1)}s;--bg:radial-gradient(circle at 30% 28%,#fff 0 7%,rgba(255,255,255,.35) 8% 20%,transparent 21%),radial-gradient(circle,${c.h}40 0 55%,${c.h}b8 100%)`;
  b.dataset.say = sp; b.dataset.c = c.h; b.textContent = label;
  w.appendChild(b); box.appendChild(w);
  w.addEventListener('animationend', e => { if (e.animationName === 'rise') w.remove(); });
}
function popBubble(b) {
  const r = b.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, fx = $('#fx');
  b.classList.add('pop'); setTimeout(() => { if (b.parentNode) b.parentNode.remove(); }, 240);
  for (let i = 0; i < 9; i++) {
    const d = document.createElement('b'), a = i / 9 * Math.PI * 2 + Math.random() * .5, dist = 8 + Math.random() * 8;
    d.style.cssText = `left:${x}px;top:${y}px;background:${b.dataset.c};--dx:${(Math.cos(a) * dist).toFixed(1)}vmin;--dy:${(Math.sin(a) * dist).toFixed(1)}vmin`;
    fx.appendChild(d); setTimeout(() => d.remove(), 700);
  }
  sfx.pop(rnd(8)); say(b.dataset.say, { rate: .85 });
  popCount++; const pc = $('#popCount'); pc.textContent = popCount; retrigger(pc, 'bump');
  if (popCount % 10 === 0) setTimeout(() => { sfx.cheer(); confetti(30); say(`${popCount}! Hooray!`, { queue: true }); }, 250);
}

/* ---------- GARAGE HIDE AND SEEK ---------- */
const hide = { wins: 0, k: 'dump', spot: 0, locked: false, name: '', t: 0 };
const DECOYS = [['🦆', 'a duck'], ['🐸', 'a frog'], ['🧱', 'a brick'], ['🚧', 'a cone'], ['🐞', 'a ladybug'], ['🎈', 'a balloon']];
function stopHide() { clearTimeout(hide.t); }
const askHide = () => say(`Where is the ${hide.name}?`, { rate: .85 });
function enterHide() {
  if (!$('#seekHear')._wired) { $('#seekHear')._wired = 1; $('#seekHear').addEventListener('click', askHide); $('#seekPic').addEventListener('pointerdown', askHide); $('#bays').addEventListener('pointerdown', onBay); }
  hide.wins = 0; newHide();
}
function newHide() {
  hide.locked = false; const n = Math.min(4, 3 + Math.floor(hide.wins / 3));
  hide.k = VKEYS[rnd(VKEYS.length)]; hide.name = VEH[hide.k].name; hide.spot = rnd(n);
  const cols = shuffle(BRIGHT), dec = shuffle(DECOYS), vc = BRIGHT[rnd(7)].h;
  hide.dec = dec;
  $('#bays').innerHTML = Array.from({ length: n }, (_, i) => `<button class="bay" data-i="${i}" style="--c:${cols[i].h};--c2:${shade(cols[i].h, -.22)}" aria-label="garage door"><div class="inside">${i === hide.spot ? VEH[hide.k].svg(vc) : `<span class="emo">${dec[i][0]}</span>`}</div><div class="door"></div></button>`).join('');
  $('#seekPic').innerHTML = VEH[hide.k].svg(vc);
  clearTimeout(hide.t); hide.t = setTimeout(askHide, 350);
}
function onBay(e) {
  const b = e.target.closest('.bay'); if (!b || hide.locked || b.classList.contains('open')) return;
  e.preventDefault(); const i = +b.dataset.i; b.classList.add('open'); sfx.swish();
  if (i === hide.spot) {
    hide.locked = true; hide.wins++; setTimeout(() => { b.classList.add('found'); sfx.cheer(); sfx.honk(); confetti(40); }, 350);
    say(`You found the ${hide.name}!`, { rate: .85 });
    clearTimeout(hide.t); hide.t = setTimeout(newHide, 3600);
  } else { setTimeout(sfx.boop, 300); say(`Oh, ${hide.dec[i][1]}! Where is the ${hide.name}?`, { rate: .85 }); }
}

/* ---------- STICKER SCENE ---------- */
const CONE = '<svg viewBox="0 0 40 50" aria-hidden="true"><g stroke="#2b2d42" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M13 5 H27 L35 43 H5 Z" fill="#ff8a1f"/><path d="M11.5 19 H28.5 M8.5 32 H31.5" stroke="#fff" stroke-width="5" fill="none"/><rect x="2" y="43" width="36" height="6" rx="2" fill="#2b2d42"/></g></svg>';
const STK = VKEYS.map((k, i) => ({ id: k, kind: 'v', name: VEH[k].name, w: 30, col: BRIGHT[i % 7].h })).concat(
  [{ id: 'cone', kind: 's', name: 'cone', w: 9 }],
  [['🌳', 'tree'], ['☀️', 'sun'], ['☁️', 'cloud'], ['⭐', 'star'], ['🏠', 'house'], ['⛑️', 'hard hat'], ['🌈', 'rainbow'], ['🦆', 'duck']].map(([v, n]) => ({ id: n, kind: 'e', val: v, name: n, w: 13 })));
const SCENES = [['site', '#69c4ff', '#cdeeff', '#cf9356', 'repeating-linear-gradient(-45deg,#ffcf1f 0 2.6vmin,#2b2d42 2.6vmin 5.2vmin)'],
  ['grass', '#69c4ff', '#cdeeff', '#6ccf5a', 'rgba(0,0,0,.15)'], ['night', '#1d2447', '#4a4f8a', '#3a3f4d', 'rgba(255,255,255,.2)'], ['snow', '#9fb8d8', '#e8f1fb', '#f4f8fc', 'rgba(0,0,0,.1)']];
let stkSel = 0, stkTool = null, stkMade = [];
const stkMarkup = s => s.kind === 'v' ? VEH[s.id].svg(s.col) : s.kind === 's' ? CONE : `<span class="emo">${s.val}</span>`;
function applyScene(i) {
  const sc = SCENES[i], el = $('#scene');
  el.style.setProperty('--sk1', sc[1]); el.style.setProperty('--sk2', sc[2]); el.style.setProperty('--gd', sc[3]); el.style.setProperty('--hz', sc[4]);
  document.querySelectorAll('#spick .vt').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
}
function stkPlace(xp, yp, s) {
  const el = document.createElement('div'), em = s.kind === 'e';
  el.className = 'stk' + (em ? ' em' : ''); el.style.cssText = `left:${xp.toFixed(2)}%;top:${yp.toFixed(2)}%;--w:${s.w}vmin;z-index:${Math.round(yp * 10)}`;
  const flip = Math.random() < .5 && s.kind === 'v' ? 'scaleX(-1)' : 'none';
  el.innerHTML = `<div class="si"><div class="fl" style="transform:${flip}">${stkMarkup(s)}</div></div>`;
  $('#scene').appendChild(el); stkMade.push(el);
  if (stkMade.length > 60) stkMade.shift().remove();
}
function enterStick() {
  if (!stkTool) {
    $('#spick').innerHTML = SCENES.map((s, i) => `<button class="vt" data-i="${i}" aria-label="${s[0]} scene"><i style="--bg:linear-gradient(${s[1]} 0,${s[2]} 55%,${s[3]} 55%)"></i></button>`).join('');
    $('#spick').addEventListener('pointerdown', e => { const b = e.target.closest('.vt'); if (b) { applyScene(+b.dataset.i); sfx.swish(); } });
    const T = $('#stools');
    T.innerHTML = STK.map((s, i) => `<button class="tb" data-i="${i}" aria-label="${s.name}">${stkMarkup(s)}</button>`).join('') +
      '<button class="tb undo" aria-label="Undo"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 15 H24 Q33 15 33 24 Q33 32 24 32 H14" fill="none" stroke="#2b2d42" stroke-width="4.5" stroke-linecap="round"/><path d="M17 8 L10 15 L17 22" fill="none" stroke="#2b2d42" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      `<button class="tb clr" aria-label="Hold to clear the scene">${TRASH}</button>`;
    T.addEventListener('pointerdown', e => {
      const b = e.target.closest('.tb'); if (!b) return;
      if (b.dataset.i != null) { stkSel = +b.dataset.i; sfx.pop(stkSel % 8); say(STK[stkSel].name, { rate: .85 }); syncStk(); }
      else if (b.classList.contains('undo')) { const el = stkMade.pop(); if (el) { el.remove(); sfx.swish(); } }
    });
    hold(T.querySelector('.clr'), () => { stkMade.forEach(el => el.remove()); stkMade = []; sfx.swish(); say('All clean!'); }, 'Hold to clear');
    const sc = $('#scene'); let drag = null;
    sc.addEventListener('pointerdown', e => {
      e.preventDefault(); const r = sc.getBoundingClientRect(), st = e.target.closest('.stk');
      try { sc.setPointerCapture(e.pointerId); } catch (_) {}
      if (st) { drag = { el: st, id: e.pointerId }; sfx.pop(3); return; }
      const s = STK[stkSel]; stkPlace((e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100, s); sfx.pop(rnd(8)); say(s.name, { rate: .85 });
    });
    sc.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return; const r = sc.getBoundingClientRect();
      const xp = clamp((e.clientX - r.left) / r.width * 100, 0, 100), yp = clamp((e.clientY - r.top) / r.height * 100, 0, 100);
      drag.el.style.left = xp.toFixed(2) + '%'; drag.el.style.top = yp.toFixed(2) + '%'; drag.el.style.zIndex = Math.round(yp * 10);
    });
    ['pointerup', 'pointercancel'].forEach(ev => sc.addEventListener(ev, () => { drag = null; }));
    stkTool = true; applyScene(0);
  }
  syncStk();
}
function syncStk() { document.querySelectorAll('#stools .tb[data-i]').forEach(b => b.classList.toggle('on-s', +b.dataset.i === stkSel)); }

/* ---------- FIND THE COLOR ---------- */
let target = null, wrong = 0, locked = false;
const prompt_ = () => say(`Can you find ${target.n}?`);
function enterFind() { newRound(); }
function newRound() {
  locked = false; wrong = 0;
  const picks = shuffle(COLORS).slice(0, 3), keys = shuffle(VKEYS).slice(0, 3);
  target = picks[rnd(3)];
  $('#findRow').innerHTML = picks.map((c, i) => `<button class="pick" data-c="${c.n}" aria-label="truck">${VEH[keys[i]].svg(c.h)}</button>`).join('');
  const dot = $('#targetDot'); dot.style.setProperty('--tc', target.h); retrigger(dot, 'pop');
  setTimeout(prompt_, 250);
}
$('#findRow').addEventListener('pointerdown', e => {
  const b = e.target.closest('.pick'); if (!b || locked) return;
  const c = COLORS.find(x => x.n === b.dataset.c);
  if (c === target) {
    locked = true; sfx.cheer(); confetti(34); retrigger(b, 'win');
    say(`${target.n}! You found ${target.n}!`);
    roundT = setTimeout(newRound, 2800);
  } else {
    wrong++; sfx.boop(); retrigger(b, 'wiggle');
    say(`That's ${c.n}. Can you find ${target.n}?`);
    if (wrong >= 2) document.querySelectorAll('.pick').forEach(p => p.classList.toggle('hint', p.dataset.c === target.n));
  }
});
$('#hear').addEventListener('click', () => prompt_());
$('#targetDot').addEventListener('pointerdown', () => prompt_());

/* ---------- ABC ---------- */
let li = 0, singId = 0;
(function buildStrip() {
  $('#strip').innerHTML = L.map((l, i) => `<button class="chip" data-i="${i}" style="--cc:${COLORS[i % 7].h}" aria-label="${l.ch}">${l.ch}</button>`).join('');
  $('#strip').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; stopSing(); showLetter(+c.dataset.i, true); });
})();
function enterAbc() { showLetter(0, true); }
function showLetter(i, speak) {
  li = ((i % 26) + 26) % 26; const l = L[li], col = COLORS[li % 7].h;
  $('#letterBlk').style.setProperty('--lc', col);
  $('#bigL').textContent = l.ch; $('#smallL').textContent = l.ch.toLowerCase();
  $('#pic').innerHTML = l.kind === 'v' ? VEH[l.val].svg(col) : `<span class="emo">${l.val}</span>`;
  $('#caption').textContent = l.say ? l.word : `${l.ch} is for ${l.word}`;
  retrigger($('#abcCard'), 'pop');
  document.querySelectorAll('#strip .chip').forEach(c => c.classList.toggle('on', +c.dataset.i === li));
  const strip = $('#strip'), chip = strip.children[li];
  strip.scrollTo({ left: chip.offsetLeft - strip.clientWidth / 2 + chip.offsetWidth / 2, behavior: 'smooth' });
  if (speak) { sfx.pop(li); say(l.p, { rate: .8 }); say(l.say || l.word, { rate: .85, queue: true }); }
}
$('#prev').addEventListener('click', () => { stopSing(); showLetter(li - 1, true); });
$('#next').addEventListener('click', () => { stopSing(); showLetter(li + 1, true); });
$('#letterBlk').addEventListener('pointerdown', () => { stopSing(); showLetter(li, true); });
$('#pic').addEventListener('pointerdown', () => { stopSing(); sfx.pop(li); const l = L[li]; say(l.say || l.word, { rate: .8 }); });
function stopSing() { singId++; const b = $('#singBtn'); if (b) b.classList.remove('on'); }
$('#singBtn').addEventListener('click', async () => {
  const b = $('#singBtn');
  if (b.classList.contains('on')) { stopSing(); hush(); return; }
  const id = ++singId; b.classList.add('on');
  for (let i = 0; i < 26; i++) {
    if (id !== singId) return;
    showLetter(i, false); sfx.pop(i);
    await say(L[i].p, { rate: .75, max: 1600 });
    await wait(i % 4 === 3 ? 450 : 200);
  }
  if (id === singId) { b.classList.remove('on'); sfx.cheer(); confetti(); say('Great singing!'); }
});

/* ---------- guard rails for small hands ---------- */
['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('visibilitychange', () => { if (document.hidden) { hush(); stopSing(); } });
})();
</script>
